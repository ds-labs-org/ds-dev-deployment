server {
    listen       80;
    server_name  localhost;

    # Must match ds-catalog-browser-ui's own baked-in configuration.json
    # "catalog_path" exactly (/api/management/v4/catalogs/request) -
    # FederatedCatalogClient::list_offers() requests that exact path at
    # the page's own origin (see src/endpoint.rs::derive_client_endpoint),
    # so nginx has to proxy that same path, unmodified, to the broker
    # service on the compose bridge network.
    location /api/management/v4/catalogs/request {
        proxy_pass http://ds-catalog-broker-rs:8080/api/management/v4/catalogs/request;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

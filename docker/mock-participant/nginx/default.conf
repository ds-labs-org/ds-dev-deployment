server {
    listen       80;
    server_name  localhost;

    # crates/crawler's crawl_one (vendor/ds-catalog-broker-rs) POSTs a
    # CatalogRequestMessage to exactly this path (see
    # docker/ds-catalog-broker-rs/participants.toml's own
    # catalog_request_url for each mock participant) and only cares about
    # the JSON body of the response - it never inspects the request body
    # itself, so a bare static file answers it correctly.
    #
    # nginx's static-file handler only answers GET/HEAD by default (a bare
    # POST here 405s); the error_page trick below re-serves the same
    # static file on that 405 instead of failing the crawl. Verified
    # locally against a plain nginx:1.28.0-bookworm container before
    # relying on it here.
    location /api/dsp/2025-1/catalog/request {
        default_type application/json;
        alias /usr/share/nginx/html/catalog-response.json;
        error_page 405 =200 $uri;
    }
}
